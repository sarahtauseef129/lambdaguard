AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: LambdaGuard Scenario C - private function with an over-permissive role

Globals:
  Function:
    Timeout: 10
    Runtime: python3.11
    MemorySize: 128
    Tags:
      Project: lambdaguard

Resources:
  SensitiveBucket:
    Type: AWS::S3::Bucket
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      Tags:
        - Key: Project
          Value: lambdaguard

  UsersTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: Users
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: user_id
          AttributeType: S
      KeySchema:
        - AttributeName: user_id
          KeyType: HASH
      Tags:
        - Key: Project
          Value: lambdaguard

  ScenarioCRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: over-permissive-access
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: 's3:*'
                Resource:
                  - !GetAtt SensitiveBucket.Arn
                  - !Sub '${SensitiveBucket.Arn}/*'
              - Effect: Allow
                Action: 'dynamodb:*'
                Resource: !GetAtt UsersTable.Arn
      Tags:
        - Key: Project
          Value: lambdaguard

  ScenarioCFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: scenario-c-func
      CodeUri: src/
      Handler: app.lambda_handler
      Role: !GetAtt ScenarioCRole.Arn
      Environment:
        Variables:
          BUCKET_NAME: !Ref SensitiveBucket
          TABLE_NAME: !Ref UsersTable
      Events:
        Nightly:
          Type: Schedule
          Properties:
            Name: nightly-job
            Schedule: rate(1 day)