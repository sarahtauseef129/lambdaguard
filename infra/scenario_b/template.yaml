AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: LambdaGuard Scenario B - vulnerable package in a shared layer

Globals:
  Function:
    Timeout: 10
    Runtime: python3.11
    MemorySize: 128
    Tags:
      Project: lambdaguard

Resources:
  CommonUtilsLayer:
    Type: AWS::Serverless::LayerVersion
    Properties:
      LayerName: common-utils-layer
      Description: Shared helper libraries
      ContentUri: layer/
      CompatibleRuntimes:
        - python3.11
      RetentionPolicy: Delete
    Metadata:
      BuildMethod: python3.11

  ScenarioBRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Tags:
        - Key: Project
          Value: lambdaguard

  ScenarioBFunc1:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: scenario-b-func-1
      CodeUri: src/
      Handler: func1.lambda_handler
      Role: !GetAtt ScenarioBRole.Arn
      Layers:
        - !Ref CommonUtilsLayer
      Events:
        Api:
          Type: HttpApi
          Properties:
            Path: /b1
            Method: get

  ScenarioBFunc2:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: scenario-b-func-2
      CodeUri: src/
      Handler: func2.lambda_handler
      Role: !GetAtt ScenarioBRole.Arn
      Layers:
        - !Ref CommonUtilsLayer

Outputs:
  ApiUrl:
    Description: Public URL of scenario B function 1
    Value: !Sub "https://${ServerlessHttpApi}.execute-api.${AWS::Region}.amazonaws.com/b1"